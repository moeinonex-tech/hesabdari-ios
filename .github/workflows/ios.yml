name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      testflight:
        description: "Build and upload to TestFlight"
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: HesabCore parity tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test (Jalali, commission, import, ledger, records, notifications)
        run: |
          set -o pipefail
          swift test --package-path HesabCore 2>&1 | tee "$RUNNER_TEMP/test.log"
      - name: Report test counts
        if: always()
        run: |
          grep -E "commission parity:|Executed [0-9]+ tests" "$RUNNER_TEMP/test.log" | tail -4 | while read -r l; do echo "::notice title=HesabCore::$l"; done
          grep -E "error:|failed" "$RUNNER_TEMP/test.log" | grep -v "^Test Suite" | head -15 | while read -r l; do echo "::error title=test::${l:0:900}"; done

  testflight:
    name: Archive and upload to TestFlight
    needs: core-tests
    # Runs only when the owner enables it (repository variable TESTFLIGHT_ENABLED=true),
    # and never for pull requests. Saves macOS minutes.
    if: >-
      github.event_name != 'pull_request' &&
      vars.TESTFLIGHT_ENABLED == 'true' &&
      (github.event_name == 'push' || inputs.testflight)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      BUNDLE_ID: ${{ vars.BUNDLE_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Check configuration
        run: |
          missing=""
          [ -n "$BUNDLE_ID" ] || missing="$missing BUNDLE_ID(variable)"
          [ -n "$TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          if [ -n "$missing" ]; then echo "::error::Missing:$missing"; exit 1; fi

      - name: Generate Xcode project
        env:
          ICLOUD_ENABLED: ${{ vars.ICLOUD_ENABLED }}
        run: |
          brew install xcodegen
          if [ "$ICLOUD_ENABLED" != "true" ]; then
            # iCloud container not set up on developer.apple.com yet: build without the iCloud entitlement
            python3 - <<'PY'
          import re
          s = open('project.yml').read()
          s = re.sub(r"\n    entitlements:\n(      .*\n)+", "\n", s)
          open('project.yml', 'w').write(s)
          PY
            echo "::notice title=iCloud::built without iCloud (set repository variable ICLOUD_ENABLED=true after creating the container)"
          fi
          xcodegen generate

      - name: Write App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          [ -n "$ASC_KEY_P8" ] || { echo "::error::Missing ASC_KEY_P8"; exit 1; }
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Hesabdari.xcodeproj \
            -scheme Hesabdari \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Hesabdari.xcarchive" \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} 2>&1 | tee "$RUNNER_TEMP/archive.log"
          # Unsigned archive: no Apple Development certificate is created on every run (account limit).
          # The export below signs once with the cloud-managed distribution certificate.

      - name: Embed entitlements
        run: |
          # An unsigned archive carries no entitlements, and the export re-signs with what the binary carries —
          # so iCloud was silently dropped. Ad-hoc sign the app with its entitlements; the export keeps them.
          APP=$(ls -d "$RUNNER_TEMP/Hesabdari.xcarchive/Products/Applications/"*.app | head -1)
          if [ -f App/Hesabdari.entitlements ]; then
            codesign --force --sign - --timestamp=none --entitlements App/Hesabdari.entitlements "$APP"
            KEYS=$(codesign -d --entitlements - --xml "$APP" 2>/dev/null | plutil -convert json -o - - 2>/dev/null | tr -d '\n' | head -c 600)
            echo "::notice title=entitlements::$KEYS"
          else
            echo "::notice title=entitlements::no entitlements file (iCloud off)"
          fi

      - name: Report archive errors
        if: failure()
        run: |
          grep -E "error:|Error Domain|No profiles|requires a provisioning|Provisioning profile|entitlement|iCloud" "$RUNNER_TEMP/archive.log" \
            | grep -v "^ *$" | sort -u | head -25 | while read -r l; do echo "::error title=archive::${l:0:900}"; done

      - name: Export and upload to App Store Connect
        run: |
          set -o pipefail
          cp ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Hesabdari.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/export.log"

      - name: Report export errors
        if: failure()
        run: |
          grep -hE "error:|Error Domain|No profiles|certificate|provisioning" "$RUNNER_TEMP/export.log" 2>/dev/null \
            | sort -u | head -20 | while read -r l; do echo "::error title=export::${l:0:900}"; done

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
