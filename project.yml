# XcodeGen spec. The .xcodeproj is generated in CI (no Mac needed) and is not committed.
# BUNDLE_ID and TEAM_ID come from the environment (GitHub repository variables / secrets).
name: Hesabdari
options:
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: fa
  createIntermediateGroups: true

packages:
  HesabCore:
    path: HesabCore

settings:
  base:
    MARKETING_VERSION: "0.17.2"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "${TEAM_ID}"

targets:
  Hesabdari:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Assets.xcassets
      - path: App/Fonts
        buildPhase: resources
      - path: App/Report
        buildPhase: resources
    dependencies:
      - package: HesabCore
        product: HesabCore
      - package: HesabCore
        product: HesabStore
    scheme: {}
    entitlements:
      path: App/Hesabdari.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.uk.moein.hesabdari]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.uk.moein.hesabdari]
        com.apple.developer.icloud-services: [CloudDocuments]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "${BUNDLE_ID}"
        PRODUCT_NAME: Hesabdari
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: دفتر حساب
        CFBundleDevelopmentRegion: fa
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSUbiquitousContainers:
          iCloud.uk.moein.hesabdari:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: دفتر حساب
            NSUbiquitousContainerSupportedFolderLevels: Any
        UIAppFonts:
          - Vazirmatn-Regular.ttf
          - Vazirmatn-Medium.ttf
          - Vazirmatn-Bold.ttf
          - Vazirmatn-ExtraBold.ttf
        NSFaceIDUsageDescription: برای باز کردن دفتر حساب با Face ID
        NSRemindersFullAccessUsageDescription: برای افزودن سررسید چک، قسط و قرار به اپ Reminders گوشی
