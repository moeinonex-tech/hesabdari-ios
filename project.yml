# XcodeGen spec. The .xcodeproj is generated in CI (no Mac needed) and is not committed.
# BUNDLE_ID and TEAM_ID come from the environment (GitHub repository variables / secrets).
name: Hesabdari
options:
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: fa
  createIntermediateGroups: true

packages:
  HesabCore:
    path: HesabCore

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "${TEAM_ID}"

targets:
  Hesabdari:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Assets.xcassets
    dependencies:
      - package: HesabCore
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "${BUNDLE_ID}"
        PRODUCT_NAME: Hesabdari
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: دفتر حساب
        CFBundleDevelopmentRegion: fa
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: برای باز کردن دفتر حساب با Face ID
